name: Build Rise of Antares Standalone APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Android SDK & Permissions
        run: |
          # Hapus local.properties agar memakai Android SDK cloud bawaan GitHub
          rm -f ./local.properties ./android_project/local.properties
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./android_project/gradlew" ]; then
            chmod +x ./android_project/gradlew
          fi

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          elif [ -f "./android_project/gradlew" ]; then
            cd android_project && ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiseOfAntares-Standalone-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            android_project/app/build/outputs/apk/debug/*.apk
          retention-days: 30
